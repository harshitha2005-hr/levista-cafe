<!DOCTYPE html>
<html>
<head>
<title>Levista Kitchen Dashboard</title>

<style>
body{
    font-family:'Segoe UI';
    background:#f8f8f8;
}

h1{
    text-align:center;
    background:#6b3e26;
    color:white;
    padding:20px;
}

.order{
    background:white;
    margin:20px auto;   /* centers it */
    padding:20px;
    border-radius:15px;
    box-shadow:0 3px 10px #ccc;
    width: 80%;         /* makes it take proper width */
    display: block;     /* ensures vertical stacking */
}

button{
    background:green;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:20px;
}
</style>

</head>

<body>

<h1>👨‍🍳 Levista Kitchen Dashboard</h1>

<div id="orders"></div>

<script>

function displayOrders(){

    fetch("https://catchy-confider-gating.ngrok-free.dev/orders")
    .then(res => res.json())
    .then(data => {

        let output = "";

        data.forEach((order,index)=>{

	output += `
<div class="order">

<h3>🪑 Table Number: ${order.tableNo}</h3>
<p>Customer: ${order.username}</p>

<h4>Items:</h4>
<ul>
${order.items.map(item=>`
<li>
${item.name} - ₹${item.price} x ${item.quantity}
</li>
`).join("")}
</ul>

<p>Status: ${order.status || "Pending"}</p>
<label>
<input type="checkbox" 
onchange="toggleStatus(${index}, this.checked)"
${order.status==="Completed"?"checked":""}>
Completed
</label>
</div>
`;            
        });

        document.getElementById("orders").innerHTML = output;

    })
    .catch(err => {
        console.error("Error fetching orders:", err);
    });
}

function toggleStatus(index, isChecked){
    fetch("https://catchy-confider-gating.ngrok-free.dev/update-status", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            index: index,
            status: isChecked ? "Completed" : "Pending"
        })
    }).then(() => displayOrders());
}
// 🔄 Auto refresh every 2 sec
setInterval(displayOrders, 2000);

// first load
displayOrders();

</script>

</body>
</html>
